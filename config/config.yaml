train_config:

  in_target_train_config:
    train_times: 
      value: 5

    num_epochs: 
      value: 15
    batch_size:
      value: 48

    warmup_ratio:
      values: [0, 0.3]
    transformer_learning_rate:
      values: [5.0e-5, 1.0e-5, 5.0e-6]
    linear_learning_rate:
      values: [1.0e-4, 1.0e-3, 1.0e-5]
    prompt_learning_rate:
      values: [1.0e-3, 1.0e-4, 1.0e-5]
    weight_decay:
      values: [1.0e-4, 1.0e-2, 1.0e-5, 1.0e-3]
    visual_soft_tokens:
      values: [7, 5, 10]
    visual_soft_prompt_dropout:
      values: [0.2, 0.4, 0]
    prompt_project:
      values: [300, -1, 512]

    if_split_hash_tag:
      values: [True, False]
    linear_injection:
#      values: [300, 512, -1]
      values: [512, -1, 300]

  zero_shot_train_config:
    train_times: 
      value: 5

    num_epochs: 
      value: 15
    batch_size: 
      value: 48

    warmup_ratio:
      values: [0, 0.3]
    transformer_learning_rate:
      values: [5.0e-5, 1.0e-5, 5.0e-6]
    linear_learning_rate:
      values: [1.0e-4, 1.0e-5, 1.0e-3]
    prompt_learning_rate:
      values: [1.0e-3, 1.0e-4, 1.0e-5]
    weight_decay:
      values: [1.0e-5, 1.0e-3, 1.0e-4, 1.0e-2]
    visual_soft_tokens:
      values: [7, 5, 10]
    visual_soft_prompt_dropout:
      values: [0.2, 0.4, 0]
    prompt_project:
      values: [300, -1, 512]

    if_split_hash_tag:
      values: [True, False]
    linear_injection:
#      values: [300, 512, -1]
      values: [512, -1, 300]


